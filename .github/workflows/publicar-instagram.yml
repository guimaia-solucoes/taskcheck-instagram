name: Publicar no Instagram

# Relógio que se reagenda sozinho: cada execução dorme até o horário do próximo post da agenda
# (no máximo 5h30, limite de um job do GitHub), publica e dispara a execução seguinte.
# Sem agendamento de reforço: se a corrente parar (falha ou bloqueio da Meta), ela só volta com um
# push na agenda/relógio ou um disparo manual. Para pausar tudo, crie o arquivo publicador/PAUSADO.

on:
  # Um push que muda a agenda ou o relógio também liga a corrente.
  push:
    branches: [main]
    paths:
      - 'publicador/agenda.json'
      - 'publicador/esperar.mjs'
      - 'publicador/PAUSADO'
      - '.github/workflows/publicar-instagram.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas simular (não publica nem reagenda)'
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IMAGEM_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/publicador/jpg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Simular
        if: ${{ inputs.dry_run }}
        run: node publicador/publicar.mjs --dry-run

      - name: Aguardar o horário do próximo post
        id: espera
        if: ${{ !inputs.dry_run }}
        run: |
          espera=$(node publicador/esperar.mjs)
          echo "Segundos até o próximo post: $espera"
          if [ "$espera" -lt 0 ]; then echo "acao=fim" >> "$GITHUB_OUTPUT"; exit 0; fi
          limite=19800
          if [ "$espera" -gt "$limite" ]; then
            echo "Próximo post está longe; dormindo ${limite}s e reagendando."
            sleep "$limite"
            echo "acao=reagendar" >> "$GITHUB_OUTPUT"
          else
            sleep "$espera"
            echo "acao=publicar" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        id: publicar
        if: ${{ steps.espera.outputs.acao == 'publicar' }}
        run: |
          git pull --quiet --rebase
          node publicador/publicar.mjs

      - name: Registrar publicação
        if: ${{ always() && steps.espera.outputs.acao == 'publicar' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicador/publicados.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Registra post publicado no Instagram"
          git push

      # Só continua a corrente se a publicação deu certo. Em caso de falha (token, bloqueio da
      # Meta etc.) a corrente para e só volta com push ou disparo manual, sem insistir na API.
      - name: Disparar a próxima execução
        if: ${{ always() && (steps.espera.outputs.acao == 'reagendar' || (steps.espera.outputs.acao == 'publicar' && steps.publicar.outcome == 'success')) }}
        run: gh workflow run publicar-instagram.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
